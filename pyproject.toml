[project]
name = "cfdict-next"
version = "0.1.0"
description = "CFDICT-Next — CFDICT (authoritative French) extended to CC-CEDICT scope with LLM-generated French"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
