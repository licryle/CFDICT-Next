[project]
name = "cfdict-next"
version = "0.1.0"
description = "CFDICT-Next — CFDICT (authoritative French) extended to CC-CEDICT scope with LLM-generated French"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.0",  # LLM record validation against schemas/llm_entry.json
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",  # workflow-file tests only
]

[project.scripts]
cfdict-validate = "cfdict_next.cli.validate:main"
cfdict-assemble = "cfdict_next.cli.assemble:main"
cfdict-cleanup = "cfdict_next.cli.cleanup:main"
cfdict-generate = "cfdict_next.cli.generate:main"
cfdict-scope-info = "cfdict_next.cli.scope_info:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
